id: go
version: 0
tier: commodity
runtime: go
status: detect-only
description: Go — DETECTION ONLY, no lanes yet.

# THIS RUNTIME IS DECLARED BUT NOT IMPLEMENTED, AND THAT IS THE POINT.
# With this file present, a repository containing Go is inventoried as "N files, runtime
# go, 0 lanes loaded" -- UNREAD. Without it, those files match no runtime and it is far too
# easy for the total to read as clean. A blind spot you can see is a different thing from one
# you cannot, and the whole discipline of this harness is refusing to let the second kind exist.
#
# When lanes are added: gofmt/AST; the toolchain is uniform enough that one pack should cover most projects

detect:
  extensions: [.go]
  filenames: [go.mod,go.sum]

unmeasured_verdict: no_lane
