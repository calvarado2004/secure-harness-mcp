id: c
version: 0
tier: commodity
runtime: c
status: detect-only
description: C — DETECTION ONLY, no lanes yet.

# THIS RUNTIME IS DECLARED BUT NOT IMPLEMENTED, AND THAT IS THE POINT.
# With this file present, a repository containing C is inventoried as "N files, runtime
# c, 0 lanes loaded" -- UNREAD. Without it, those files match no runtime and it is far too
# easy for the total to read as clean. A blind spot you can see is a different thing from one
# you cannot, and the whole discipline of this harness is refusing to let the second kind exist.
#
# When lanes are added: memory safety is the axis that matters and it needs a different oracle shape entirely: findings are not per-route

detect:
  extensions: [.c,.h]
  filenames: [Makefile]

unmeasured_verdict: no_lane
