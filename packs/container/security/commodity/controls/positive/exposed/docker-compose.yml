
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dealership_pass
    ports:
      - "5432:5432"
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
