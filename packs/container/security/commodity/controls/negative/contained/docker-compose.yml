
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    expose:
      - "5432"
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    ports:
      - "127.0.0.1:9000:9000"
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
