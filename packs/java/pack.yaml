id: java
version: 0
tier: commodity
runtime: java
status: detect-only
description: Java — DETECTION ONLY, no lanes yet.

# THIS RUNTIME IS DECLARED BUT NOT IMPLEMENTED, AND THAT IS THE POINT.
# With this file present, a repository containing Java is inventoried as "N files, runtime
# java, 0 lanes loaded" -- UNREAD. Without it, those files match no runtime and it is far too
# easy for the total to read as clean. A blind spot you can see is a different thing from one
# you cannot, and the whole discipline of this harness is refusing to let the second kind exist.
#
# When lanes are added: Spring and Jakarta express routing and authorization very differently — expect a framework tier here, as with FastAPI

detect:
  extensions: [.java]
  filenames: [pom.xml,build.gradle]

unmeasured_verdict: no_lane
