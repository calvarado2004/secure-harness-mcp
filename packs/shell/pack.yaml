id: shell
version: 0
tier: commodity
runtime: shell
status: detect-only
description: Shell — DETECTION ONLY, no lanes yet.

# THIS RUNTIME IS DECLARED BUT NOT IMPLEMENTED, AND THAT IS THE POINT.
# With this file present, a repository containing Shell is inventoried as "N files, runtime
# shell, 0 lanes loaded" -- UNREAD. Without it, those files match no runtime and it is far too
# easy for the total to read as clean. A blind spot you can see is a different thing from one
# you cannot, and the whole discipline of this harness is refusing to let the second kind exist.
#
# When lanes are added: deploy and CI scripts: injection through unquoted expansion, secrets in argv, curl-pipe-sh — the defects here reach production directly

detect:
  extensions: [.sh,.bash]
  filenames: [Makefile]
  shebang: [sh, bash]

unmeasured_verdict: no_lane
