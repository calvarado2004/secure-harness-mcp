id: general/security
version: 1
tier: commodity
axis: security
description: Security rules whose defect is the same in every language.

# THE FIRST RULE THAT ACTUALLY NEEDED THE BIND MECHANISM.
# "A bootstrap path creates a privileged account with a literal credential" is true of a SQL
# seed script and of a Python one in exactly the same way, and the attack is word-for-word
# identical. Declaring it twice would give one defect two ids and two weights, so a
# repository that seeded an administrator in both places would score it as two different
# problems. It is declared once here and BOUND by each language pack that can detect it.

rules:
  seed/default-admin-credential:
    sev: HIGH
    remedy: >-
      read the bootstrap password from the environment and refuse to seed without it, or
      create the account disabled and force a password to be set on first use. Seeding the
      first administrator is legitimate; shipping its password is not.
    attack: >-
      the attacker reads the repository -- or simply guesses, because these passwords are
      always `admin123` or `changeme` -- and signs in as an administrator on any deployment
      that ran the seed. No vulnerability is required and nothing in the application logs
      looks unusual, because the login is legitimate. It is the same privilege escalation as
      a client-settable role field, arriving through the data instead of the API.
    # A known-good implementation, handed to the model with the finding. Prose says what is
    # wrong; a reference shows what right looks like -- and this project has already measured
    # the difference between a model that was told a fix was needed and a model that was told
    # exactly what the fix was.
    reference: references/secure-bootstrap.md
    overreach: >-
      A SEED SCRIPT IS ALLOWED TO DO THINGS APPLICATION CODE IS NOT. It must be able to
      create the first administrator, because without that account nobody can log in to
      create the second one, and a rule that forbade bootstrap accounts outright would be
      correct in the abstract and switched off within a week. So the rule fires only on the
      part that is not necessary: the credential being a LITERAL. An account seeded with a
      NULL or environment-supplied password is treated as the fix and stays silent, and an
      unprivileged demo account with a literal password is not this rule's business at all.

  # THE SECOND RULE THAT NEEDED THE BIND MECHANISM.
  # "A handler computes an authorization answer and then does nothing with it" is the same
  # defect in FastAPI, Flask, Express and Spring, and the attack is word-for-word identical.
  # Reading it is framework-specific; being it is not. Declared once here, bound by each
  # framework pack that can detect it, so one defect keeps one id and one weight.
  authz/decision-without-denial:
    sev: HIGH
    remedy: >-
      make the comparison decide the response. Deny explicitly on the failing path -- return
      403, or 404 where the endpoint should not confirm that the object exists -- rather than
      letting control fall through to the success path.
    attack: >-
      the attacker requests another user's object by identifier while authenticated as
      themselves. The handler compares them against the owner, the comparison fails, and
      because the failing branch neither returns nor raises, the handler carries on and
      serves the object anyway. Every review that asks "does this endpoint check ownership?"
      answers yes, and the check has no effect on what comes back.
    overreach: >-
      NOT EVERY CONDITIONAL THAT MENTIONS A USER IS A BROKEN AUTHORIZATION CHECK. A branch
      that records a decision into a variable, sets a flag, or narrows a query is doing work,
      and reporting it would tell a developer to add a denial to code that already handles
      the case elsewhere. The rule therefore fires only when the matching branch is INERT --
      `pass`, `...`, or nothing but a docstring -- and no `else` exists. A conditional whose
      outcome is used later is out of scope by construction, which also means a decision
      that is stored and then mishandled further down is missed. That is the price of not
      guessing.

  # THE RULE THIS PROJECT LEARNED FROM A REPOSITORY IT DID NOT WRITE THE ORACLES FOR.
  # Pointing the harness at a real product surfaced exactly one serious defect, and no lane
  # found it: a committed `.env` holding a JWT signing key and a database URL, in a public
  # repository. It was visible only in the inventory's UNCLAIMED list, because `.env` is a
  # file type no runtime claims. A blind spot that reports itself is worth a great deal, and
  # a blind spot that closes is worth more.
  secrets/committed-credential-file:
    sev: HIGH
    remedy: >-
      rotate every value the file contains, on the assumption that anything ever pushed is
      disclosed; then untrack it (`git rm --cached`), add it to `.gitignore`, and keep a
      committed `.env.example` carrying the KEYS and no values. Deleting the file in a new
      commit does not remove it from history, so a rewrite is needed as well if the
      repository was ever public.
    attack: >-
      the attacker clones the repository, or reads it on the hosting site, and holds the
      application's token signing key. They can then mint a session for any account without
      touching the login path, and nothing in the logs distinguishes those requests from
      legitimate ones. Where the file also carries a database URL, the credential in it is
      usually reachable from anywhere the database is.
    overreach: >-
      A COMMITTED TEMPLATE IS THE FIX, NOT THE DEFECT. `.env.example`, `.env.sample` and
      `.env.template` exist precisely so the keys can be committed without the values, and a
      rule that flagged them would be telling a project to delete its own documentation. The
      rule therefore fires only on a file that is TRACKED, that is not a template by name,
      and whose values are not placeholders. An untracked `.env` on a developer's disk is
      not this rule's business at all: that is where secrets are supposed to live.
